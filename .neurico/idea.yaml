idea:
  title: What's surprisingly different between base and instruct models?
  domain: artificial_intelligence
  hypothesis: 'Take a base and an instruct model. Look at the divergence between their
    distributions, token by token. Train a model to predict the KL (or whatever) between
    them at every token. Then look at places where the

    divergence predictor

    is wrong. I think that''s where the interesting stuff will be.'
